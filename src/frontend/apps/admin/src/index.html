<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Brand assets, Step 30: docs/steps/step-30-design-system-theming-and-visual-identity.md.
         No manifest/PWA icons here — the admin has no PWA/installable configuration to hang
         them off (CSR-only, no service worker); it only needed its favicon replaced. -->
    <meta name="theme-color" content="#4338ca" />
    <!-- Apply the stored (or OS) colour scheme before first paint, so dark mode does not flash
         white. `ColourSchemeService` makes the same decision once the app is up. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kh-admin-scheme');
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="brand/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <kh-root></kh-root>
  </body>
</html>

<!--
  The landmarks, and nothing else. Header, navigation and footer arrive at Step 23.
  The skip link is first in the tab order on purpose: it is the only way a keyboard user reaches
  the content without tabbing through the whole header that will eventually sit above it.
-->
<a class="kh-skip-link" href="#main-content">Skip to main content</a>

@if (loading()) {
<div class="kh-progress" role="progressbar" aria-label="Loading" aria-busy="true"></div>
}

<main id="main-content" tabindex="-1">
  <router-outlet />
</main>

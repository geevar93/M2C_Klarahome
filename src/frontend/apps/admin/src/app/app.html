<!--
  The progress bar and the outlet, and nothing else.

  Everything a signed-in user sees around a screen — the skip link, the navigation landmarks, the
  `main` element, the toasts — lives in `kh-admin-shell`, which the routed `ShellLayout` renders.
  Putting them here would wrap them around the sign-in page too.
-->
@if (loading()) {
<div class="kh-progress" role="progressbar" aria-label="Loading" aria-busy="true"></div>
}

<router-outlet />

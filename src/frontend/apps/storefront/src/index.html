<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <!--
      The title here is only what a browser tab says before Angular has rendered; `SeoService`
      replaces it on every route, on the server, so the HTML a crawler receives never carries it.
    -->
    <title>Klara Home</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Never `maximum-scale` or `user-scalable=no`: preventing zoom fails WCAG 1.4.4 outright, and
      on a 360px screen pinch-zoom is how a lot of people read a specification table.
    -->
    <!-- Brand assets, Step 30: docs/steps/step-30-design-system-theming-and-visual-identity.md -->
    <meta name="theme-color" content="#714c35" />
    <link rel="icon" type="image/svg+xml" href="brand/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="brand/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!--
      The display face every heading is set in (libs/ui/primitives/src/styles/_typography.scss).
      Preloaded because otherwise the browser learns of it only after the stylesheet has been
      parsed and a heading has been laid out, and the swap lands late. One file, latin subset,
      ~35KB. `crossorigin` is required for a font preload even from the same origin, or the
      preloaded response is not reused and the file is fetched twice.
    -->
    <link rel="preload" href="/fonts/fraunces-600-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <kh-root></kh-root>
  </body>
</html>

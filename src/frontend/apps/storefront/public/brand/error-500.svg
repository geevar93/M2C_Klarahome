  <path d="M124 42 A40 40 0 0 1 140 80 V140" fill="none" stroke="#9e6d43" stroke-width="8" stroke-linecap="round" />
  <circle cx="110" cy="42" r="6" fill="#47351f" />
  <text
    x="120"
    y="158"
    text-anchor="middle"
    font-family="Fraunces, 'Fraunces Fallback', Georgia, serif"
    font-weight="600"
    font-size="28"
    fill="#340c00"
  >500</text>
</svg>

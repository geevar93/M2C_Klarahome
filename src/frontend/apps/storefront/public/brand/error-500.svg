<!--
  500 art — same visual language as error-404.svg: geometric, not illustrated. One arch, drawn
  with a broken keystone, standing in for something that failed structurally rather than a page
  that was never there. Used above kh-empty-state on the server-error page, outside the component
  for the same reason noted in error-404.svg.
-->

# Klara Home - production stack (single VPS)
#
# Everything the product needs, in containers, behind a Caddy reverse proxy that runs on the
# HOST rather than in this file. Caddy owns 80/443 and the certificates; every container here
# publishes on 127.0.0.1 only, so nothing in this stack is reachable from the internet except
# through Caddy (infra/caddy/Caddyfile).
#
#   Guide:    docs/deployment-vps.md
#   Up:       docker compose -f infra/compose/docker-compose.prod.yml --env-file .env.prod up -d
#   Migrate:  docker compose -f infra/compose/docker-compose.prod.yml --env-file .env.prod \
#               --profile migrate run --rm migrator
#
# Differences from docker-compose.dev.yml, all deliberate:
#   * no Traefik      - Caddy on the host terminates TLS and routes (docs/deployment-vps.md 5)
#   * no Mailpit      - mail goes to a real SMTP provider
#   * the data network is `internal: true` - postgres and redis have no route to the internet
#     and publish no host port at all
#   * ASPNETCORE_ENVIRONMENT=Production, which turns on the guards: the API refuses to boot with
#     Database:MigrateOnStartup, with sensitive data logging, or without a real signing key, and
#     the demo catalogue seeder is refused whatever configuration says
#   * every value that must not be guessed is written as ${VAR:?message} - compose fails with
#     that message rather than starting a stack with a development password in it
#
# The database lives on the named volume ${COMPOSE_PROJECT_NAME}-postgres-data. Moving it to
# Neon or another managed provider is one variable - see docs/deployment-vps.md 9.

name: ${COMPOSE_PROJECT_NAME:-klarahome}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-service-defaults: &defaults
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18 - one database, one schema per module (ADR-002).
  #
  # No published port and no route to the internet: it is reached only by the API, the worker and
  # the migrator, over the internal `data` network. Use `docker compose exec postgres psql` or an
  # SSH tunnel for anything else (docs/deployment-vps.md 8).
  # ---------------------------------------------------------------------------
  postgres:
    <<: *defaults
    image: postgres:18.6-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - generate one, never reuse the dev default}
      # ICU collation pinned so index and ORDER BY behaviour matches development exactly. It is
      # fixed when the volume is first initialised and cannot be changed afterwards without a
      # dump and restore.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-IN --encoding=UTF8"
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      # Roughly a quarter of host RAM. 2GB suits the 8GB production box in
      # docs/06-infrastructure-devops.md 2; lower it on a smaller VPS.
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      # Every statement slower than this is logged, which is what makes a slow page diagnosable
      # after the fact rather than only while somebody is watching.
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-500}
      - -c
      - log_checkpoints=on
      - -c
      - log_lock_waits=on
    volumes:
      # Postgres 18 images declare the volume at /var/lib/postgresql and set
      # PGDATA=/var/lib/postgresql/18/docker. Do not override PGDATA: a value that disagrees with
      # the image initialises a SECOND empty cluster inside the volume, and the data looks lost.
      - postgres-data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-2.00}"
          memory: ${POSTGRES_MEMORY_LIMIT:-3G}

  # ---------------------------------------------------------------------------
  # Redis 8 - HybridCache L2, sessions, rate-limit counters, idempotency keys.
  # Nothing here is the system of record: losing this volume costs a cold cache.
  # ---------------------------------------------------------------------------
  redis:
    <<: *defaults
    image: redis:8.10.1-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome}-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --maxmemory ${REDIS_MAXMEMORY:-512mb}
        --maxmemory-policy allkeys-lru
        --save 900 1
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  # ---------------------------------------------------------------------------
  # MinIO - S3-compatible object storage (ADR-010).
  #
  # Published on loopback because Caddy proxies s3.<domain> to it: presigned upload and download
  # URLs are signed for that public hostname, and SigV4 covers the host, so the browser must reach
  # the same name the API signed for. MINIO_SERVER_URL is what makes MinIO accept those
  # signatures.
  # ---------------------------------------------------------------------------
  minio:
    <<: *defaults
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome}-minio
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SERVER_URL: https://s3.${DOMAIN:?DOMAIN is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      # The console is NOT proxied by Caddy. Reach it over an SSH tunnel when it is needed:
      #   ssh -L 9001:127.0.0.1:9001 <vps>   then open http://127.0.0.1:9001
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  # ---------------------------------------------------------------------------
  # One-shot bucket bootstrap. Runs on every `up` and does nothing once the buckets exist.
  # Bucket names per docs/08-integrations.md 4.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome}-minio-init
    restart: "no"
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PUBLIC_BUCKET: ${STORAGE_PUBLIC_BUCKET:-media-public}
      PRIVATE_BUCKET: ${STORAGE_PRIVATE_BUCKET:-docs-private}
    entrypoint:
      - sh
      - -c
      - >-
        set -e;
        mc alias set kh http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing "kh/$$PUBLIC_BUCKET";
        mc mb --ignore-existing "kh/$$PRIVATE_BUCKET";
        mc anonymous set download "kh/$$PUBLIC_BUCKET";
        mc version enable "kh/$$PRIVATE_BUCKET";
        echo "buckets ready - $$PUBLIC_BUCKET (public read), $$PRIVATE_BUCKET (private, versioned)"
    networks:
      - data

  # ---------------------------------------------------------------------------
  # imgproxy - on-the-fly image resizing, served at cdn.<domain>.
  #
  # IMGPROXY_KEY and IMGPROXY_SALT are MANDATORY here. Without them anyone who finds the hostname
  # has a free image proxy billed to this server; and the API must be given the same pair
  # (Media__Imgproxy__*), or every URL it generates is rejected.
  # ---------------------------------------------------------------------------
  imgproxy:
    <<: *defaults
    image: ghcr.io/imgproxy/imgproxy:v3.30
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome}-imgproxy
    depends_on:
      minio:
        condition: service_healthy
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_KEY: ${IMGPROXY_KEY:?IMGPROXY_KEY is required in production - docs/deployment-vps.md 4}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?IMGPROXY_SALT is required in production - docs/deployment-vps.md 4}
      # Only the media bucket. Without an allow-list imgproxy fetches and resizes any URL it is
      # handed, which is server-side request forgery with a CDN in front of it.
      IMGPROXY_ALLOWED_SOURCES: http://minio:9000/${STORAGE_PUBLIC_BUCKET:-media-public}/
      IMGPROXY_MAX_SRC_RESOLUTION: "64"
      IMGPROXY_MAX_ANIMATION_FRAMES: "1"
      IMGPROXY_TTL: "2592000"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_LOG_FORMAT: json
    ports:
      - "127.0.0.1:${IMGPROXY_PORT:-8082}:8080"
    networks:
      - data
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ---------------------------------------------------------------------------
  # API - ASP.NET Core 10 modular monolith.
  #
  # Published on loopback for Caddy. It joins `egress` as well as `data` because it calls
  # Razorpay, the courier and the SMS and email providers; postgres and redis do not.
  # ---------------------------------------------------------------------------
  api:
    <<: *defaults
    image: ${REGISTRY:-klarahome}/api:${IMAGE_TAG:?IMAGE_TAG is required - deploy a specific tag, never `latest`}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome}-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      APP_ROLE: api
      # THE database address. One variable, so moving to Neon or any other managed provider is an
      # edit to .env.prod and a restart - nothing in this file changes (docs/deployment-vps.md 9).
      ConnectionStrings__Postgres: ${DATABASE_CONNECTION_STRING:?DATABASE_CONNECTION_STRING is required}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Tenant__Code: ${TENANT_CODE:-klarahome}
      Tenant__Name: ${TENANT_NAME:-Klara Home}
      Tenant__Id: ${TENANT_ID:-}
      Tenant__DefaultLocale: ${TENANT_DEFAULT_LOCALE:-en-IN}
      Tenant__DefaultTimeZone: ${TENANT_DEFAULT_TIMEZONE:-Asia/Kolkata}
      # Identity. A real RSA key, or the host refuses to start: an ephemeral key differs in every
      # replica and is discarded on every restart, signing every user out without explanation.
      Auth__Tokens__SigningKeys__0__KeyId: ${AUTH_SIGNING_KEY_ID:?AUTH_SIGNING_KEY_ID is required}
      Auth__Tokens__SigningKeys__0__PrivateKeyPem: ${AUTH_SIGNING_KEY_PEM:?AUTH_SIGNING_KEY_PEM is required - docs/deployment-vps.md 4}
      #
      # The key IDENTIFIER is written literally here rather than taken from a variable, because
      # compose interpolates values and not keys: `Keys__${SOMETHING}` would be passed to the
      # container with the dollar sign intact. Rotating a key is therefore a two-line edit to
      # this file - add `Auth__Encryption__Keys__prod2` beside the current one, then point
      # CurrentKeyId at it - and the old entry stays until nothing encrypted with it is left.
      Auth__Encryption__CurrentKeyId: prod
      Auth__Encryption__Keys__prod: ${AUTH_ENCRYPTION_KEY:?AUTH_ENCRYPTION_KEY is required}
      # Column encryption, for values the application must read back but must not store in the
      # clear - a seller's bank account number. A DIFFERENT key from the one above: this one
      # protects business data, and losing it loses the data rather than only the sessions.
      Encryption__CurrentKeyId: prod
      Encryption__Keys__prod: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      # True, always, in a deployed environment: the cookies travel over HTTPS through Caddy.
      Auth__Tokens__RefreshCookieSecure: "true"
      Carts__CartCookieSecure: "true"
      Auth__Bootstrap__Email: ${AUTH_BOOTSTRAP_EMAIL:-}
      Auth__Bootstrap__Password: ${AUTH_BOOTSTRAP_PASSWORD:-}
      Auth__External__Google__Enabled: ${AUTH_GOOGLE_ENABLED:-false}
      Auth__External__Google__ClientId: ${AUTH_GOOGLE_CLIENT_ID:-}
      Auth__External__Google__ClientSecret: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      Auth__External__Facebook__Enabled: ${AUTH_FACEBOOK_ENABLED:-false}
      Auth__External__Facebook__ClientId: ${AUTH_FACEBOOK_CLIENT_ID:-}
      Auth__External__Facebook__ClientSecret: ${AUTH_FACEBOOK_CLIENT_SECRET:-}
      Auth__External__CallbackBaseUrl: https://api.${DOMAIN}
      Auth__External__AllowedReturnUrls__0: https://${DOMAIN}
      Auth__External__AllowedReturnUrls__1: https://admin.${DOMAIN}
      Auth__External__DefaultReturnUrl: https://${DOMAIN}/
      # Never true in Production - the host refuses to start if it is. Migrations are applied by
      # the migrator job before this container is recreated.
      Database__MigrateOnStartup: "false"
      Database__EnableSensitiveDataLogging: "false"
      Observability__ServiceName: klarahome-api
      Observability__OtlpEndpoint: ${OBSERVABILITY_OTLP_ENDPOINT:-}
      Observability__ConsoleJson: "true"
      # The browser origins that may call this API with credentials. All are subdomains of DOMAIN,
      # which is also what makes the SameSite=Lax refresh cookie work across them.
      Cors__AllowedOrigins__0: https://${DOMAIN}
      Cors__AllowedOrigins__1: https://www.${DOMAIN}
      Cors__AllowedOrigins__2: https://admin.${DOMAIN}
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__Bucket: ${STORAGE_PUBLIC_BUCKET:-media-public}
      Storage__PrivateBucket: ${STORAGE_PRIVATE_BUCKET:-docs-private}
      Storage__ForcePathStyle: "true"
      Storage__PublicBaseUrl: https://s3.${DOMAIN}/${STORAGE_PUBLIC_BUCKET:-media-public}
      # Presigned URLs are signed for the address a browser will use, not the one the API writes
      # through: SigV4 covers the host, so a URL signed for http://minio:9000 is unreachable and
      # cannot be rewritten.
      Storage__SignedUrlEndpoint: https://s3.${DOMAIN}
      Media__RequireVirusScan: ${MEDIA_REQUIRE_VIRUS_SCAN:-false}
      Media__Imgproxy__BaseUrl: https://cdn.${DOMAIN}
      Media__Imgproxy__SourceBaseUrl: http://minio:9000/${STORAGE_PUBLIC_BUCKET:-media-public}
      Media__Imgproxy__Key: ${IMGPROXY_KEY}
      Media__Imgproxy__Salt: ${IMGPROXY_SALT}
      # Payments. Blank credentials remain the shippable state - a prepaid placement answers 503
      # naming the reason and cash on delivery keeps working - but a live store wants these set.
      Razorpay__KeyId: ${RAZORPAY_KEY_ID:-}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET:-}
      Razorpay__WebhookSecret: ${RAZORPAY_WEBHOOK_SECRET:-}
      Razorpay__AccountNumber: ${RAZORPAY_ACCOUNT_NUMBER:-}
      Razorpay__RouteEnabled: ${RAZORPAY_ROUTE_ENABLED:-false}
      Razorpay__BaseUrl: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1/}
      Payments__Provider: ${PAYMENTS_PROVIDER:-razorpay}
      Payments__RetryWindowHours: ${PAYMENTS_RETRY_WINDOW_HOURS:-24}
      Payments__AutoRefundOnCancellation: ${PAYMENTS_AUTO_REFUND_ON_CANCELLATION:-true}
      # Every polling loop belongs to the worker and nowhere else. The webhook endpoints are
      # served here - they only store and answer.
      Payments__EventProcessorEnabled: "false"
      Payments__ReconciliationEnabled: "false"
      Payments__SettlementIngestionEnabled: "false"
      Shipping__Provider: ${SHIPPING_PROVIDER:-}
      Shipping__ApiKey: ${SHIPPING_API_KEY:-}
      Shipping__ApiUser: ${SHIPPING_API_USER:-}
      Shipping__ApiSecret: ${SHIPPING_API_SECRET:-}
      Shipping__WebhookSecret: ${SHIPPING_WEBHOOK_SECRET:-}
      Shipping__BaseUrl: ${SHIPPING_BASE_URL:-}
      Shipping__EventProcessorEnabled: "false"
      Shipping__TrackingPollEnabled: "false"
      Shipping__ServiceabilityRefreshEnabled: "false"
      Payouts__Provider: ${PAYOUTS_PROVIDER:-}
      Payouts__Mode: ${PAYOUTS_MODE:-IMPS}
      Payouts__Narration: ${PAYOUTS_NARRATION:-Marketplace payout}
      Settlements__SchedulerEnabled: "false"
      Settlements__ReconciliationEnabled: "false"
      Search__Provider: ${SEARCH_PROVIDER:-}
      Search__BaseUrl: ${SEARCH_BASE_URL:-}
      Search__ApiKey: ${SEARCH_API_KEY:-}
      Search__ReindexEnabled: "false"
      Notifications__DispatcherEnabled: "false"
      Email__Provider: ${EMAIL_PROVIDER:-smtp}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS is required}
      Email__FromName: ${EMAIL_FROM_NAME:-}
      Email__Smtp__Host: ${EMAIL_SMTP_HOST:-}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT:-587}
      Email__Smtp__UserName: ${EMAIL_SMTP_USERNAME:-}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:-}
      Email__Smtp__UseTls: ${EMAIL_SMTP_USE_TLS:-true}
      Sms__Provider: ${SMS_PROVIDER:-}
      Sms__ApiKey: ${SMS_API_KEY:-}
      Sms__SenderId: ${SMS_SENDER_ID:-}
      Sms__DltEntityId: ${SMS_DLT_ENTITY_ID:-}
    networks:
      - data
      - egress
    healthcheck:
      test: ["CMD", "/app/KlaraHome.Api", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-2.00}"
          memory: ${API_MEMORY_LIMIT:-2G}

  # ---------------------------------------------------------------------------
  # Worker - background host. Drains the outbox and the notification queue, and runs every
  # polling loop in the product. It publishes no port and nothing may reach it.
  #
  # It is the ONLY host with these loops enabled: two hosts polling the same queues contend for
  # the same rows for no gain. Do not scale this service beyond one replica.
  # ---------------------------------------------------------------------------
  worker:
    <<: *defaults
    image: ${REGISTRY:-klarahome}/worker:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome}-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      APP_ROLE: worker
      ConnectionStrings__Postgres: ${DATABASE_CONNECTION_STRING}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Tenant__Code: ${TENANT_CODE:-klarahome}
      Tenant__Name: ${TENANT_NAME:-Klara Home}
      Tenant__Id: ${TENANT_ID:-}
      Tenant__DefaultLocale: ${TENANT_DEFAULT_LOCALE:-en-IN}
      Tenant__DefaultTimeZone: ${TENANT_DEFAULT_TIMEZONE:-Asia/Kolkata}
      Encryption__CurrentKeyId: prod
      Encryption__Keys__prod: ${ENCRYPTION_KEY}
      Auth__Encryption__CurrentKeyId: prod
      Auth__Encryption__Keys__prod: ${AUTH_ENCRYPTION_KEY}
      Database__MigrateOnStartup: "false"
      Database__RunSeeders: "false"
      Observability__ServiceName: klarahome-worker
      Observability__OtlpEndpoint: ${OBSERVABILITY_OTLP_ENDPOINT:-}
      Observability__ConsoleJson: "true"
      # The loops. The worker image already turns these on in its own appsettings.json; they are
      # repeated here so that what runs where is readable in one file.
      Outbox__Enabled: "true"
      Notifications__DispatcherEnabled: "true"
      Payments__EventProcessorEnabled: "true"
      Payments__ReconciliationEnabled: "true"
      Payments__SettlementIngestionEnabled: "true"
      Shipping__EventProcessorEnabled: "true"
      Shipping__TrackingPollEnabled: "true"
      Shipping__ServiceabilityRefreshEnabled: "true"
      Settlements__SchedulerEnabled: "true"
      Settlements__ReconciliationEnabled: "true"
      Search__ReindexEnabled: "true"
      Search__ReindexIntervalMinutes: "15"
      Razorpay__KeyId: ${RAZORPAY_KEY_ID:-}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET:-}
      Razorpay__WebhookSecret: ${RAZORPAY_WEBHOOK_SECRET:-}
      Razorpay__AccountNumber: ${RAZORPAY_ACCOUNT_NUMBER:-}
      Razorpay__RouteEnabled: ${RAZORPAY_ROUTE_ENABLED:-false}
      Razorpay__BaseUrl: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1/}
      Payments__Provider: ${PAYMENTS_PROVIDER:-razorpay}
      Payments__RetryWindowHours: ${PAYMENTS_RETRY_WINDOW_HOURS:-24}
      Payments__AutoRefundOnCancellation: ${PAYMENTS_AUTO_REFUND_ON_CANCELLATION:-true}
      Shipping__Provider: ${SHIPPING_PROVIDER:-}
      Shipping__ApiKey: ${SHIPPING_API_KEY:-}
      Shipping__ApiUser: ${SHIPPING_API_USER:-}
      Shipping__ApiSecret: ${SHIPPING_API_SECRET:-}
      Shipping__WebhookSecret: ${SHIPPING_WEBHOOK_SECRET:-}
      Shipping__BaseUrl: ${SHIPPING_BASE_URL:-}
      Payouts__Provider: ${PAYOUTS_PROVIDER:-}
      Payouts__Mode: ${PAYOUTS_MODE:-IMPS}
      Payouts__Narration: ${PAYOUTS_NARRATION:-Marketplace payout}
      Search__Provider: ${SEARCH_PROVIDER:-}
      Search__BaseUrl: ${SEARCH_BASE_URL:-}
      Search__ApiKey: ${SEARCH_API_KEY:-}
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__Bucket: ${STORAGE_PUBLIC_BUCKET:-media-public}
      Storage__PrivateBucket: ${STORAGE_PRIVATE_BUCKET:-docs-private}
      Storage__ForcePathStyle: "true"
      Storage__PublicBaseUrl: https://s3.${DOMAIN}/${STORAGE_PUBLIC_BUCKET:-media-public}
      Storage__SignedUrlEndpoint: https://s3.${DOMAIN}
      Email__Provider: ${EMAIL_PROVIDER:-smtp}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS}
      Email__FromName: ${EMAIL_FROM_NAME:-}
      Email__Smtp__Host: ${EMAIL_SMTP_HOST:-}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT:-587}
      Email__Smtp__UserName: ${EMAIL_SMTP_USERNAME:-}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:-}
      Email__Smtp__UseTls: ${EMAIL_SMTP_USE_TLS:-true}
      Sms__Provider: ${SMS_PROVIDER:-}
      Sms__ApiKey: ${SMS_API_KEY:-}
      Sms__SenderId: ${SMS_SENDER_ID:-}
      Sms__DltEntityId: ${SMS_DLT_ENTITY_ID:-}
    networks:
      - data
      - egress
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-1.00}"
          memory: ${WORKER_MEMORY_LIMIT:-1G}

  # ---------------------------------------------------------------------------
  # Storefront - the shop, server-rendered.
  #
  # It fetches the API over the PUBLIC hostname, the same URL the browser uses, so the document
  # rendered on the server and the transfer cache the browser reads it out of are keyed alike.
  # That request leaves the container, reaches Caddy and comes back; `extra_hosts` is what keeps
  # it on this machine instead of relying on the provider's hairpin NAT.
  #
  # Unlike development there is NO NODE_TLS_REJECT_UNAUTHORIZED here: the certificate is real.
  # ---------------------------------------------------------------------------
  storefront:
    <<: *defaults
    image: ${REGISTRY:-klarahome}/storefront:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/storefront.Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome}-storefront
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STOREFRONT_PORT:-4000}:4000"
    extra_hosts:
      # api.<domain> resolves to the host's docker bridge address, where Caddy is listening.
      # TLS still verifies: Caddy answers on SNI, so it serves the certificate for this name.
      - "api.${DOMAIN}:host-gateway"
    environment:
      KH_API_BASE_URL: https://api.${DOMAIN}
      KH_TENANT_CODE: ${TENANT_CODE:-klarahome}
      KH_LOCALE: ${TENANT_DEFAULT_LOCALE:-en-IN}
      KH_TIME_ZONE: ${TENANT_DEFAULT_TIMEZONE:-Asia/Kolkata}
      KH_ENVIRONMENT: production
      KH_IMAGE_BASE_URL: https://cdn.${DOMAIN}
      KH_ANALYTICS_PROVIDER: ${KH_ANALYTICS_PROVIDER:-}
      KH_ANALYTICS_MEASUREMENT_ID: ${KH_ANALYTICS_MEASUREMENT_ID:-}
      # Angular's server engine answers 400 to a Host header it does not recognise. Behind Caddy
      # every request carries the site's hostname, so it must be listed here or the site is a wall
      # of 400s - a failure that never appears in development.
      KH_ALLOWED_HOSTS: ${DOMAIN},www.${DOMAIN},localhost,127.0.0.1
      # Caddy terminates TLS and is the only thing that can reach this process. Without this the
      # renderer believes it is serving http on port 4000 and writes that into every absolute URL.
      KH_TRUST_PROXY_HEADERS: "true"
    networks:
      - egress
    deploy:
      resources:
        limits:
          cpus: "${STOREFRONT_CPU_LIMIT:-1.50}"
          memory: ${STOREFRONT_MEMORY_LIMIT:-1G}

  # ---------------------------------------------------------------------------
  # Admin - the back office. Static files behind nginx; it talks to the API from the browser,
  # cross-origin through the allow-list the API declares, so it proxies nothing.
  # ---------------------------------------------------------------------------
  admin:
    <<: *defaults
    image: ${REGISTRY:-klarahome}/admin:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/admin.Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome}-admin
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8081}:8080"
    environment:
      KH_API_BASE_URL: https://api.${DOMAIN}
      KH_TENANT_CODE: ${TENANT_CODE:-klarahome}
      KH_LOCALE: ${TENANT_DEFAULT_LOCALE:-en-IN}
      KH_TIME_ZONE: ${TENANT_DEFAULT_TIMEZONE:-Asia/Kolkata}
      KH_ENVIRONMENT: production
      KH_IMAGE_BASE_URL: https://cdn.${DOMAIN}
      KH_ANALYTICS_PROVIDER: ${KH_ANALYTICS_PROVIDER:-}
      KH_ANALYTICS_MEASUREMENT_ID: ${KH_ANALYTICS_MEASUREMENT_ID:-}
    networks:
      - egress
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Migrator - the one-shot migration and seed job.
  #
  # NOT started by `up`: it sits in the `migrate` profile so a normal start cannot race it
  # against the API. Run it to completion and check the exit code BEFORE recreating the API:
  #
  #   docker compose -f infra/compose/docker-compose.prod.yml --env-file .env.prod \
  #     --profile migrate run --rm migrator
  #
  # Exit 0 = every module's migrations applied and every seeder run. Exit 1 = stop the deploy.
  # ---------------------------------------------------------------------------
  migrator:
    profiles: ["migrate"]
    restart: "no"
    logging: *logging
    security_opt:
      - no-new-privileges:true
    image: ${REGISTRY:-klarahome}/migrator:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/migrator.Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome}-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      APP_ROLE: migrator
      ConnectionStrings__Postgres: ${DATABASE_CONNECTION_STRING}
      # The migrator seeds the tenant row and the store settings, so it needs the whole
      # white-label identity, not just the code it stamps on a log line.
      Tenant__Code: ${TENANT_CODE:-klarahome}
      Tenant__Name: ${TENANT_NAME:-Klara Home}
      Tenant__Id: ${TENANT_ID:-}
      Tenant__DefaultLocale: ${TENANT_DEFAULT_LOCALE:-en-IN}
      Tenant__DefaultTimeZone: ${TENANT_DEFAULT_TIMEZONE:-Asia/Kolkata}
      # The India Post PIN code CSV, if one has been placed in infra/seed. Blank skips the import.
      Platform__PincodeDataPath: ${PINCODE_DATA_PATH:-}
      # The first platform administrator. The seeder does nothing at all once any administrator
      # exists, so these can be blanked again after the first successful run.
      Auth__Bootstrap__Email: ${AUTH_BOOTSTRAP_EMAIL:-}
      Auth__Bootstrap__Password: ${AUTH_BOOTSTRAP_PASSWORD:-}
      # The same keys the API uses: the bootstrap administrator's authenticator secret is written
      # encrypted, and a key that differs from the API's makes it unreadable at sign-in.
      Auth__Encryption__CurrentKeyId: prod
      Auth__Encryption__Keys__prod: ${AUTH_ENCRYPTION_KEY}
      Encryption__CurrentKeyId: prod
      Encryption__Keys__prod: ${ENCRYPTION_KEY}
      # Idempotent, and re-run on every deploy. Set false only for a restore drill that must
      # bring a schema up to date without touching data.
      Database__RunSeeders: ${DATABASE_RUN_SEEDERS:-true}
      Observability__ServiceName: klarahome-migrator
      Observability__ConsoleJson: "true"
    volumes:
      # Read-only reference data an operator supplies rather than the product shipping. This is
      # the one bind mount in the stack, and it is mounted into a job container that exits.
      - ../seed:/app/seed:ro
    networks:
      - data
      - egress
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

networks:
  # Backing services. `internal: true` means no route to the internet and no published ports:
  # a compromised dependency in one of these images cannot phone home.
  data:
    name: ${COMPOSE_PROJECT_NAME:-klarahome}-data
    internal: true
  # Outbound, for the containers that call Razorpay, the courier, the SMS and email providers,
  # and - for the renderer - this site's own public hostname.
  egress:
    name: ${COMPOSE_PROJECT_NAME:-klarahome}-egress

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-klarahome}-postgres-data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-klarahome}-redis-data
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:-klarahome}-minio-data

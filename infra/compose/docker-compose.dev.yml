# Klara Home - local development environment (Step 2)
#
# Brings up every backing service the platform needs, matching what will run on the VPS,
# plus the API container (Step 3) and the one-shot migrator job (Step 4). The worker,
# storefront and admin containers arrive with the steps that give them something to do.
#
#   Up:    ./infra/scripts/dev.ps1 up          (Windows)
#          ./infra/scripts/dev.sh up           (bash/WSL2)
#   Raw:   docker compose -f infra/compose/docker-compose.dev.yml --env-file .env up -d
#
# Every value below has a working default, so the stack starts with no .env at all.
# Copy .env.example to .env only when you need to override something (see docs/dev-setup.md).

name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &defaults
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  # ---------------------------------------------------------------------------
  # Traefik v3 - reverse proxy and local TLS termination.
  # Serves its own self-signed certificate unless you drop a mkcert pair into
  # infra/traefik/certs/ and enable dynamic/certs.yml (see docs/dev-setup.md).
  # ---------------------------------------------------------------------------
  traefik:
    <<: *defaults
    image: traefik:v3.6.25
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ../traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - ../traefik/certs:/etc/traefik/certs:ro
      # Read-only socket: Traefik discovers routers from container labels.
      # Production (Step 32) puts a socket proxy in front of this - see the Parking Lot.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${DEV_DOMAIN:-klarahome.localhost}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.tls=true

  # ---------------------------------------------------------------------------
  # PostgreSQL 18 - one database, one schema per module (ADR-002).
  # ---------------------------------------------------------------------------
  postgres:
    <<: *defaults
    image: postgres:18.6-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-klarahome}
      POSTGRES_USER: ${POSTGRES_USER:-klarahome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klarahome_dev_password}
      # ICU collation pinned so index and ORDER BY behaviour matches the VPS exactly.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-IN --encoding=UTF8"
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500
    ports:
      # Published for psql/DBeaver/EF tooling. Override POSTGRES_PORT if 5432 is
      # already taken by a native PostgreSQL install (common on Windows).
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images declare the volume at /var/lib/postgresql and set
      # PGDATA=/var/lib/postgresql/18/docker. Do not override PGDATA.
      - postgres-data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Redis 8 - HybridCache L2, sessions, rate-limit counters, idempotency keys.
  # ---------------------------------------------------------------------------
  redis:
    <<: *defaults
    image: redis:8.10.1-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-klarahome_dev_password}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 900 1
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M

  # ---------------------------------------------------------------------------
  # MinIO - S3-compatible object storage (ADR-010). Same API as S3/R2, so moving
  # to managed storage later is a configuration change with no code impact.
  # ---------------------------------------------------------------------------
  minio:
    <<: *defaults
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-minio
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-klarahome}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-klarahome_dev_password}
      MINIO_BROWSER_REDIRECT_URL: https://minio.${DEV_DOMAIN:-klarahome.localhost}
      MINIO_SERVER_URL: https://s3.${DEV_DOMAIN:-klarahome.localhost}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-klarahome-dev}-edge
      # S3 API
      - traefik.http.routers.minio-api.rule=Host(`s3.${DEV_DOMAIN:-klarahome.localhost}`)
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.tls=true
      - traefik.http.routers.minio-api.service=minio-api
      - traefik.http.services.minio-api.loadbalancer.server.port=9000
      # Web console
      - traefik.http.routers.minio-console.rule=Host(`minio.${DEV_DOMAIN:-klarahome.localhost}`)
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.tls=true
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.services.minio-console.loadbalancer.server.port=9001

  # ---------------------------------------------------------------------------
  # One-shot bucket bootstrap. Bucket names per docs/08-integrations.md #4.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-minio-init
    restart: "no"
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-klarahome}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-klarahome_dev_password}
      PUBLIC_BUCKET: ${STORAGE_PUBLIC_BUCKET:-media-public}
      PRIVATE_BUCKET: ${STORAGE_PRIVATE_BUCKET:-docs-private}
    entrypoint:
      - sh
      - -c
      - >-
        set -e;
        mc alias set kh http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing "kh/$$PUBLIC_BUCKET";
        mc mb --ignore-existing "kh/$$PRIVATE_BUCKET";
        mc anonymous set download "kh/$$PUBLIC_BUCKET";
        mc version enable "kh/$$PRIVATE_BUCKET";
        echo "buckets ready - $$PUBLIC_BUCKET (public read), $$PRIVATE_BUCKET (private, versioned)"
    networks:
      - data

  # ---------------------------------------------------------------------------
  # Mailpit - captures every outbound email in development. Nothing leaves the
  # machine; the Notifications module (Step 8) points its SMTP sender here.
  # ---------------------------------------------------------------------------
  mailpit:
    <<: *defaults
    image: axllent/mailpit:v1.31.0
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-mailpit
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "2000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-klarahome-dev}-edge
      - traefik.http.routers.mailpit.rule=Host(`mail.${DEV_DOMAIN:-klarahome.localhost}`)
      - traefik.http.routers.mailpit.entrypoints=websecure
      - traefik.http.routers.mailpit.tls=true
      - traefik.http.services.mailpit.loadbalancer.server.port=8025

  # ---------------------------------------------------------------------------
  # API - ASP.NET Core 10 modular monolith (Step 3).
  # Built from infra/docker/api.Dockerfile with the REPOSITORY ROOT as context.
  # Publishes no host port: Traefik is the only way in.
  # ---------------------------------------------------------------------------
  api:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      args:
        BUILD_CONFIGURATION: ${API_BUILD_CONFIGURATION:-Release}
    image: klarahome/api:${API_IMAGE_TAG:-dev}
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      APP_ROLE: api
      # Container-internal names and ports: the API talks to the data network, never
      # through the host-published ports.
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-klarahome};Username=${POSTGRES_USER:-klarahome};Password=${POSTGRES_PASSWORD:-klarahome_dev_password}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:-klarahome_dev_password}
      Tenant__Code: ${TENANT_CODE:-klarahome}
      Tenant__Name: ${TENANT_NAME:-Klara Home}
      Tenant__Id: ${TENANT_ID:-}
      Tenant__DefaultLocale: ${TENANT_DEFAULT_LOCALE:-en-IN}
      Tenant__DefaultTimeZone: ${TENANT_DEFAULT_TIMEZONE:-Asia/Kolkata}
      # Identity (Step 7). Blank signing keys are tolerated only here, in Development: the host
      # mints an ephemeral RSA key and warns on every start. Any other environment refuses to boot.
      Auth__Tokens__SigningKeys__0__KeyId: ${AUTH_SIGNING_KEY_ID:-}
      Auth__Tokens__SigningKeys__0__PrivateKeyPem: ${AUTH_SIGNING_KEY_PEM:-}
      Auth__Encryption__CurrentKeyId: ${AUTH_ENCRYPTION_KEY_ID:-dev}
      Auth__Encryption__Keys__dev: ${AUTH_ENCRYPTION_KEY:-a2xhcmFob21lLWRldmVsb3BtZW50LW9ubHkta2V5ISE=}
      # Column encryption (Step 9), for values the application must read back but must not store in
      # the clear - a seller's bank account number. Same dev key material as Auth__Encryption above
      # so a developer has one key to rotate, and a separate section because it protects business
      # data rather than credentials. Generate a distinct pair per environment at Step 32.
      Encryption__CurrentKeyId: ${ENCRYPTION_KEY_ID:-dev}
      Encryption__Keys__dev: ${ENCRYPTION_KEY:-a2xhcmFob21lLWRldmVsb3BtZW50LW9ubHkta2V5ISE=}
      # False because the dev stack is reachable over plain http through Traefik's local
      # certificate; a browser will not return a Secure cookie over http and sign-in would appear
      # to fail silently. Never false in staging or production.
      Auth__Tokens__RefreshCookieSecure: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      # The anonymous basket's cookie (Step 13). Secure for the same reason and with the same
      # exception as the refresh cookie above: a browser will not return a Secure cookie over the
      # dev stack's plain http, and the shopper's basket would silently empty on every request.
      Carts__CartCookieSecure: ${CART_COOKIE_SECURE:-false}
      Auth__Bootstrap__Email: ${AUTH_BOOTSTRAP_EMAIL:-}
      Auth__Bootstrap__Password: ${AUTH_BOOTSTRAP_PASSWORD:-}
      # Identity providers (Step 7A). Unconfigured by default: a provider with no client id is
      # left off the sign-in page rather than offered and broken.
      Auth__External__Google__Enabled: ${AUTH_GOOGLE_ENABLED:-false}
      Auth__External__Google__ClientId: ${AUTH_GOOGLE_CLIENT_ID:-}
      Auth__External__Google__ClientSecret: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      Auth__External__Facebook__Enabled: ${AUTH_FACEBOOK_ENABLED:-false}
      Auth__External__Facebook__ClientId: ${AUTH_FACEBOOK_CLIENT_ID:-}
      Auth__External__Facebook__ClientSecret: ${AUTH_FACEBOOK_CLIENT_SECRET:-}
      Auth__External__CallbackBaseUrl: ${AUTH_EXTERNAL_CALLBACK_BASE_URL:-https://api.${DEV_DOMAIN:-klarahome.localhost}}
      Auth__External__AllowedReturnUrls__0: ${AUTH_EXTERNAL_ALLOWED_RETURN_URL:-https://${DEV_DOMAIN:-klarahome.localhost}}
      Auth__External__DefaultReturnUrl: ${AUTH_EXTERNAL_DEFAULT_RETURN_URL:-https://${DEV_DOMAIN:-klarahome.localhost}/}
      Database__MigrateOnStartup: ${DATABASE_MIGRATE_ON_STARTUP:-false}
      Database__EnableSensitiveDataLogging: ${DATABASE_SENSITIVE_LOGGING:-false}
      Observability__ServiceName: klarahome-api
      Observability__OtlpEndpoint: ${OBSERVABILITY_OTLP_ENDPOINT:-}
      # Containers log JSON even in Development: this is what a log shipper reads. The
      # human-readable console template is for `dotnet run` in a terminal.
      Observability__ConsoleJson: ${OBSERVABILITY_CONSOLE_JSON:-true}
      Cors__AllowedOrigins__0: https://${DEV_DOMAIN:-klarahome.localhost}
      Cors__AllowedOrigins__1: https://admin.${DEV_DOMAIN:-klarahome.localhost}
      # Media, storage and documents (Step 8). Path-style addressing because MinIO is reached by a
      # bare host name; the public base URL is what a browser fetches, so it is the Traefik address
      # rather than the internal one the API writes through.
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:-klarahome}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-klarahome_dev_password}
      Storage__Bucket: ${STORAGE_PUBLIC_BUCKET:-media-public}
      Storage__PrivateBucket: ${STORAGE_PRIVATE_BUCKET:-docs-private}
      Storage__ForcePathStyle: "true"
      Storage__PublicBaseUrl: https://s3.${DEV_DOMAIN:-klarahome.localhost}/${STORAGE_PUBLIC_BUCKET:-media-public}
      # Presigned URLs are signed for the address a browser will use, not the one the API writes
      # through: SigV4 covers the host, so a URL signed for http://minio:9000 is unreachable and
      # cannot be rewritten. MinIO accepts it because MINIO_SERVER_URL names the same host.
      Storage__SignedUrlEndpoint: https://s3.${DEV_DOMAIN:-klarahome.localhost}
      Media__RequireVirusScan: ${MEDIA_REQUIRE_VIRUS_SCAN:-false}
      Media__Imgproxy__BaseUrl: https://img.${DEV_DOMAIN:-klarahome.localhost}
      Media__Imgproxy__SourceBaseUrl: http://minio:9000/${STORAGE_PUBLIC_BUCKET:-media-public}
      Media__Imgproxy__Key: ${IMGPROXY_KEY:-}
      Media__Imgproxy__Salt: ${IMGPROXY_SALT:-}
      # Payments (Step 15). Blank credentials are the shippable state: with no key pair the gateway
      # adapter reports itself unusable, a prepaid placement answers 503 naming the reason, and cash
      # on delivery keeps working. Filling RAZORPAY_* into .env is the whole of turning it on.
      # The key id is publishable by design - it is what the browser widget is initialised with.
      # The other two never leave the server.
      Razorpay__KeyId: ${RAZORPAY_KEY_ID:-}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET:-}
      Razorpay__WebhookSecret: ${RAZORPAY_WEBHOOK_SECRET:-}
      Razorpay__AccountNumber: ${RAZORPAY_ACCOUNT_NUMBER:-}
      Razorpay__RouteEnabled: ${RAZORPAY_ROUTE_ENABLED:-false}
      Razorpay__BaseUrl: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1/}
      Payments__Provider: ${PAYMENTS_PROVIDER:-razorpay}
      Payments__RetryWindowHours: ${PAYMENTS_RETRY_WINDOW_HOURS:-24}
      Payments__AutoRefundOnCancellation: ${PAYMENTS_AUTO_REFUND_ON_CANCELLATION:-true}
      # The three payment loops run in the worker and nowhere else, for the same reason the outbox
      # and notification dispatchers do: every API replica polling would multiply the work and race
      # for the same rows. The webhook endpoint itself is served here - it only stores and answers.
      Payments__EventProcessorEnabled: "false"
      Payments__ReconciliationEnabled: "false"
      Payments__SettlementIngestionEnabled: "false"
      # Shipping (Step 16; Shiprocket at Step 16A). Blank credentials are the shippable state here
      # too: with no courier account the manual adapter books parcels from an air waybill an
      # operator types in, and everything downstream - the label, the order timeline, the cash
      # reconciliation - is unchanged. Shipping__Provider names the adapter (`shiprocket` in v1,
      # blank or unknown falls back to `manual`); filling SHIPPING_* into .env is the whole of
      # turning a courier on. Where the store DELIVERS is a store setting, not a variable.
      Shipping__Provider: ${SHIPPING_PROVIDER:-}
      Shipping__ApiKey: ${SHIPPING_API_KEY:-}
      Shipping__ApiUser: ${SHIPPING_API_USER:-}
      Shipping__ApiSecret: ${SHIPPING_API_SECRET:-}
      Shipping__WebhookSecret: ${SHIPPING_WEBHOOK_SECRET:-}
      Shipping__BaseUrl: ${SHIPPING_BASE_URL:-}
      # The three shipping loops run in the worker and nowhere else, for the same reason the payment
      # ones do. The webhook endpoint itself is served here - it only stores and answers.
      Shipping__EventProcessorEnabled: "false"
      Shipping__TrackingPollEnabled: "false"
      Shipping__ServiceabilityRefreshEnabled: "false"
      # Vendor payouts (Step 18). Blank is the shippable state once more: with no rail named, sales
      # still earn, deductions still come off, periods still close and batches are still built and
      # approved - only the transfer refuses, with a named 503, and the ledger goes on saying what
      # every seller is owed. Payouts__Provider names the rail (`route` or `x`); filling PAYOUTS_*
      # into .env is the whole of turning payouts on.
      Payouts__Provider: ${PAYOUTS_PROVIDER:-}
      Payouts__Mode: ${PAYOUTS_MODE:-IMPS}
      Payouts__Narration: ${PAYOUTS_NARRATION:-Marketplace payout}
      # The two settlement loops run in the worker and nowhere else, for the same reason every other
      # loop does. The endpoints are served here - they read, and they build a batch a human signs.
      Settlements__SchedulerEnabled: "false"
      Settlements__ReconciliationEnabled: "false"
      # Search (Step 19). PostgreSQL full text needs nothing configured, so a blank provider is the
      # working state rather than a degraded one (ADR-019). The staleness sweep runs in the worker.
      Search__Provider: ${SEARCH_PROVIDER:-}
      Search__BaseUrl: ${SEARCH_BASE_URL:-}
      Search__ApiKey: ${SEARCH_API_KEY:-}
      Search__ReindexEnabled: "false"
      # Notifications (Step 8). The dispatcher runs in the worker and nowhere else; every API
      # replica polling the same queue would multiply the work and contend for the same rows.
      Notifications__DispatcherEnabled: "false"
      Email__Provider: ${EMAIL_PROVIDER:-smtp}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-no-reply@klarahome.localhost}
      Email__FromName: ${EMAIL_FROM_NAME:-}
      Email__Smtp__Host: ${EMAIL_SMTP_HOST:-mailpit}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT:-1025}
      Email__Smtp__UserName: ${EMAIL_SMTP_USERNAME:-}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:-}
      # Mailpit speaks plain SMTP on the compose network. Never false outside development.
      Email__Smtp__UseTls: ${EMAIL_SMTP_USE_TLS:-false}
      # Empty, because there is no SMS account (docs/08-integrations.md section 7). Outside
      # Production an SMS is delivered to Mailpit instead, so a developer can complete an OTP
      # sign-in; Production records it as Suppressed / NoProvider (ADR-017).
      Sms__Provider: ${SMS_PROVIDER:-}
      Sms__ApiKey: ${SMS_API_KEY:-}
      Sms__SenderId: ${SMS_SENDER_ID:-}
      Sms__DltEntityId: ${SMS_DLT_ENTITY_ID:-}
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "/app/KlaraHome.Api", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1G
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-klarahome-dev}-edge
      - traefik.http.routers.api.rule=Host(`api.${DEV_DOMAIN:-klarahome.localhost}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.middlewares=security-headers@file,compression@file
      - traefik.http.services.api.loadbalancer.server.port=8080

  # ---------------------------------------------------------------------------
  # imgproxy - on-the-fly image resizing and re-encoding (Step 8).
  # docs/08-integrations.md section 4: the storefront asks for exactly the
  # rendition a viewport needs and imgproxy produces it from the original in the
  # public bucket. Nothing is stored: the URL is the instruction.
  #
  # IMGPROXY_KEY / IMGPROXY_SALT are what stop this being an open image proxy for
  # anybody who finds the host - bandwidth billed here, under this domain. Leave
  # them blank in development and URLs are unsigned; SET THEM in any deployed
  # environment (Step 32), and set the matching Media__Imgproxy__* on the API.
  # ---------------------------------------------------------------------------
  imgproxy:
    <<: *defaults
    image: ghcr.io/imgproxy/imgproxy:v3.30
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-imgproxy
    depends_on:
      minio:
        condition: service_healthy
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      # Only the media bucket. Without an allow-list imgproxy will fetch and resize
      # any URL it is handed, which is a server-side request forgery with a CDN in
      # front of it (docs/07-security-compliance.md section 3).
      IMGPROXY_ALLOWED_SOURCES: http://minio:9000/${STORAGE_PUBLIC_BUCKET:-media-public}/
      # 64 megapixels. A decompression bomb is cheap to upload and expensive to
      # decode; the registry caps dimensions on the way in and this caps them again
      # on the way out, because imgproxy also serves originals stored before that
      # limit existed.
      IMGPROXY_MAX_SRC_RESOLUTION: "64"
      IMGPROXY_MAX_ANIMATION_FRAMES: "1"
      IMGPROXY_TTL: "2592000"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_LOG_FORMAT: json
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-klarahome-dev}-edge
      - traefik.http.routers.imgproxy.rule=Host(`img.${DEV_DOMAIN:-klarahome.localhost}`)
      - traefik.http.routers.imgproxy.entrypoints=websecure
      - traefik.http.routers.imgproxy.tls=true
      - traefik.http.services.imgproxy.loadbalancer.server.port=8080

  # ---------------------------------------------------------------------------
  # Worker - background host (Step 8).
  # Drains the transactional outbox (Step 4) and the notification queue (Step 8).
  # It publishes no port and carries no Traefik label: nothing may reach it.
  #
  # It is the ONLY host with Outbox__Enabled and Notifications__DispatcherEnabled
  # set. Two hosts polling the same queues would contend for the same rows for no
  # gain - the claims are safe (FOR UPDATE SKIP LOCKED), the duplication is waste.
  # ---------------------------------------------------------------------------
  worker:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        BUILD_CONFIGURATION: ${API_BUILD_CONFIGURATION:-Release}
    image: klarahome/worker:${API_IMAGE_TAG:-dev}
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      APP_ROLE: worker
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-klarahome};Username=${POSTGRES_USER:-klarahome};Password=${POSTGRES_PASSWORD:-klarahome_dev_password}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:-klarahome_dev_password}
      Tenant__Code: ${TENANT_CODE:-klarahome}
      Tenant__Name: ${TENANT_NAME:-Klara Home}
      Tenant__Id: ${TENANT_ID:-}
      Tenant__DefaultLocale: ${TENANT_DEFAULT_LOCALE:-en-IN}
      Tenant__DefaultTimeZone: ${TENANT_DEFAULT_TIMEZONE:-Asia/Kolkata}
      Database__MigrateOnStartup: "false"
      Database__RunSeeders: "false"
      Observability__ServiceName: klarahome-worker
      Observability__OtlpEndpoint: ${OBSERVABILITY_OTLP_ENDPOINT:-}
      Observability__ConsoleJson: ${OBSERVABILITY_CONSOLE_JSON:-true}
      Outbox__Enabled: "true"
      Notifications__DispatcherEnabled: "true"
      # Payments (Step 15). Blank credentials are the shippable state: with no key pair the gateway
      # adapter reports itself unusable, a prepaid placement answers 503 naming the reason, and cash
      # on delivery keeps working. Filling RAZORPAY_* into .env is the whole of turning it on.
      # The key id is publishable by design - it is what the browser widget is initialised with.
      # The other two never leave the server.
      Razorpay__KeyId: ${RAZORPAY_KEY_ID:-}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET:-}
      Razorpay__WebhookSecret: ${RAZORPAY_WEBHOOK_SECRET:-}
      Razorpay__AccountNumber: ${RAZORPAY_ACCOUNT_NUMBER:-}
      Razorpay__RouteEnabled: ${RAZORPAY_ROUTE_ENABLED:-false}
      Razorpay__BaseUrl: ${RAZORPAY_BASE_URL:-https://api.razorpay.com/v1/}
      Payments__Provider: ${PAYMENTS_PROVIDER:-razorpay}
      Payments__RetryWindowHours: ${PAYMENTS_RETRY_WINDOW_HOURS:-24}
      Payments__AutoRefundOnCancellation: ${PAYMENTS_AUTO_REFUND_ON_CANCELLATION:-true}
      Payments__EventProcessorEnabled: "true"
      Payments__ReconciliationEnabled: "true"
      Payments__SettlementIngestionEnabled: "true"
      # Shipping (Step 16). The same arrangement: blank credentials fall back to hand-booked air
      # waybills, and the three loops - the courier webhook drain, the tracking poll that recovers a
      # lost webhook, and the nightly serviceability refresh - run here and nowhere else.
      Shipping__Provider: ${SHIPPING_PROVIDER:-}
      Shipping__ApiKey: ${SHIPPING_API_KEY:-}
      Shipping__ApiUser: ${SHIPPING_API_USER:-}
      Shipping__ApiSecret: ${SHIPPING_API_SECRET:-}
      Shipping__WebhookSecret: ${SHIPPING_WEBHOOK_SECRET:-}
      Shipping__BaseUrl: ${SHIPPING_BASE_URL:-}
      Shipping__EventProcessorEnabled: "true"
      Shipping__TrackingPollEnabled: "true"
      Shipping__ServiceabilityRefreshEnabled: "true"
      # Vendor payouts (Step 18). The same arrangement: a blank rail sends nothing and refuses
      # honestly, and the two settlement loops - the scheduler that closes each seller's period once
      # its return hold expires, and the sweep that re-reads in-flight transfers from the gateway -
      # run here and nowhere else.
      Payouts__Provider: ${PAYOUTS_PROVIDER:-}
      Payouts__Mode: ${PAYOUTS_MODE:-IMPS}
      Payouts__Narration: ${PAYOUTS_NARRATION:-Marketplace payout}
      Settlements__SchedulerEnabled: "true"
      Settlements__ReconciliationEnabled: "true"
      # Search (Step 19). The staleness sweep is the safety net under the event pipeline, and it runs
      # here and nowhere else - two processes rebuilding the same rows would corrupt nothing and
      # double the load on the catalogue for no benefit.
      Search__Provider: ${SEARCH_PROVIDER:-}
      Search__BaseUrl: ${SEARCH_BASE_URL:-}
      Search__ApiKey: ${SEARCH_API_KEY:-}
      Search__ReindexEnabled: "true"
      Search__ReindexIntervalMinutes: "15"
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:-klarahome}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-klarahome_dev_password}
      Storage__Bucket: ${STORAGE_PUBLIC_BUCKET:-media-public}
      Storage__PrivateBucket: ${STORAGE_PRIVATE_BUCKET:-docs-private}
      Storage__ForcePathStyle: "true"
      Storage__PublicBaseUrl: https://s3.${DEV_DOMAIN:-klarahome.localhost}/${STORAGE_PUBLIC_BUCKET:-media-public}
      # Presigned URLs are signed for the address a browser will use, not the one the API writes
      # through: SigV4 covers the host, so a URL signed for http://minio:9000 is unreachable and
      # cannot be rewritten. MinIO accepts it because MINIO_SERVER_URL names the same host.
      Storage__SignedUrlEndpoint: https://s3.${DEV_DOMAIN:-klarahome.localhost}
      Email__Provider: ${EMAIL_PROVIDER:-smtp}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-no-reply@klarahome.localhost}
      Email__FromName: ${EMAIL_FROM_NAME:-}
      Email__Smtp__Host: ${EMAIL_SMTP_HOST:-mailpit}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT:-1025}
      Email__Smtp__UserName: ${EMAIL_SMTP_USERNAME:-}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:-}
      Email__Smtp__UseTls: ${EMAIL_SMTP_USE_TLS:-false}
      Sms__Provider: ${SMS_PROVIDER:-}
      Sms__ApiKey: ${SMS_API_KEY:-}
      Sms__SenderId: ${SMS_SENDER_ID:-}
      Sms__DltEntityId: ${SMS_DLT_ENTITY_ID:-}
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Migrator - one-shot database migration job (Step 4).
  # Applies every module's pending EF Core migrations, runs the idempotent
  # seeders, and exits. The API never migrates on startup.
  #
  # It is NOT started by `docker compose up`: it sits in the `migrate` profile so
  # a normal `up` does not race it against the API. Run it explicitly:
  #
  #   docker compose -f infra/compose/docker-compose.dev.yml --profile migrate   #     run --rm migrator
  #
  # This is the same shape the deploy pipeline uses on the VPS (Step 32): run the
  # job to completion, check the exit code, then start the new API version.
  # ---------------------------------------------------------------------------
  migrator:
    profiles: ["migrate"]
    restart: "no"
    logging: *logging
    security_opt:
      - no-new-privileges:true
    build:
      context: ../..
      dockerfile: infra/docker/migrator.Dockerfile
      args:
        BUILD_CONFIGURATION: ${API_BUILD_CONFIGURATION:-Release}
    image: klarahome/migrator:${API_IMAGE_TAG:-dev}
    container_name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      APP_ROLE: migrator
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-klarahome};Username=${POSTGRES_USER:-klarahome};Password=${POSTGRES_PASSWORD:-klarahome_dev_password}
      # The migrator seeds the tenant row and the initial settings, so it needs the whole
      # white-label identity, not just the code it stamps on a log line.
      Tenant__Code: ${TENANT_CODE:-klarahome}
      Tenant__Name: ${TENANT_NAME:-Klara Home}
      Tenant__Id: ${TENANT_ID:-}
      Tenant__DefaultLocale: ${TENANT_DEFAULT_LOCALE:-en-IN}
      Tenant__DefaultTimeZone: ${TENANT_DEFAULT_TIMEZONE:-Asia/Kolkata}
      Platform__PincodeDataPath: ${PINCODE_DATA_PATH:-}
      # The migrator runs the seeder that creates the first platform administrator, so it needs
      # the credential and the key their authenticator secret will be protected with. It does
      # nothing at all once any administrator exists.
      Auth__Bootstrap__Email: ${AUTH_BOOTSTRAP_EMAIL:-}
      Auth__Bootstrap__Password: ${AUTH_BOOTSTRAP_PASSWORD:-}
      Auth__Encryption__CurrentKeyId: ${AUTH_ENCRYPTION_KEY_ID:-dev}
      Auth__Encryption__Keys__dev: ${AUTH_ENCRYPTION_KEY:-a2xhcmFob21lLWRldmVsb3BtZW50LW9ubHkta2V5ISE=}
      # Column encryption (Step 9), for values the application must read back but must not store in
      # the clear - a seller's bank account number. Same dev key material as Auth__Encryption above
      # so a developer has one key to rotate, and a separate section because it protects business
      # data rather than credentials. Generate a distinct pair per environment at Step 32.
      Encryption__CurrentKeyId: ${ENCRYPTION_KEY_ID:-dev}
      Encryption__Keys__dev: ${ENCRYPTION_KEY:-a2xhcmFob21lLWRldmVsb3BtZW50LW9ubHkta2V5ISE=}
      Database__RunSeeders: ${DATABASE_RUN_SEEDERS:-true}
      Observability__ServiceName: klarahome-migrator
      Observability__ConsoleJson: ${OBSERVABILITY_CONSOLE_JSON:-true}
    volumes:
      # Reference data an operator supplies rather than the product shipping: the India Post PIN
      # code CSV. Read-only, and empty until somebody puts a file there - the import is skipped
      # when PINCODE_DATA_PATH points at nothing.
      - ../seed:/app/seed:ro
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

networks:
  # Only Traefik publishes 80/443 here; application containers join it and are reached
  # only through Traefik.
  edge:
    name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-edge
  # Backing services. In staging/production (Step 32) this network becomes
  # internal: true and publishes no host ports; dev keeps them for local tooling.
  data:
    name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-data

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-postgres-data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-redis-data
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-minio-data
  mailpit-data:
    name: ${COMPOSE_PROJECT_NAME:-klarahome-dev}-mailpit-data

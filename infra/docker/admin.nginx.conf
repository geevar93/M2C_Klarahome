# =============================================================================
# Klara Home - admin static server
# =============================================================================
# A hardened nginx serving one single-page application
# (docs/06-infrastructure-devops.md §3). It serves files and nothing else: the
# admin app talks to the API cross-origin, through the CORS allow-list the API
# already declares, so there is no proxy_pass here and no second place where a
# back-end address is written down.
# =============================================================================

server {
    # 8080 rather than 80 so the container needs no privileged port and can be
    # moved to an unprivileged image without touching this file.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing here is a secret, but nothing here should advertise its version
    # to a scanner either.
    server_tokens off;

    # Traefik applies the platform's security headers at the edge
    # (security-headers@file). These two are repeated here on purpose: a
    # request that reaches this container by any other route still gets them.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Written by the entrypoint from the KH_* environment, and read by the
    # browser BEFORE the app bootstraps. It must never be cached: a stale copy
    # points a redeployed admin at the previous deployment's API.
    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Every file that can change carries a content hash in its name
    # (outputHashing: 'all'), so a year is safe for the hashed assets.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # The application shell. Never cached, because it is the document that
    # names which hashed bundles this deployment uses.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}

# Traefik v3 static configuration - DEVELOPMENT ONLY.
#
# Mounted at /etc/traefik/traefik.yml (the default path) so that both the server
# and the `traefik healthcheck` CLI read the same file.
#
# Differences from the staging/production configuration (Step 32):
#   - no ACME/Let's Encrypt resolver; TLS is self-signed or mkcert-provided
#   - no HSTS (it would poison every other *.localhost site in the browser)
#   - dashboard is exposed without authentication, on localhost only
#   - the Docker socket is mounted directly rather than through a socket proxy

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Content-Type: keep

api:
  dashboard: true
  insecure: false

ping:
  entryPoint: ping

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: false

  websecure:
    address: ":443"
    http:
      tls: {}
      middlewares:
        - security-headers@file
        - compression@file

  # Container-internal only; never published to the host.
  ping:
    address: ":8082"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true
